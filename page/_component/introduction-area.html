<section class="introduction-area" id="about" aria-labelledby="introduction-heading" data-flux="flux-scroll-progress flux-size">
	<span class="introduction-rail-marker" aria-hidden="true"></span>
	<div class="section-box">
		<header class="section-heading">
			<span class="section-badge">About Authwave</span>
			<h2 id="introduction-heading">Introduction</h2>
		</header>
		<div class="introduction-concertina" data-reserve-concertina data-flux="flux-size">
			<details name="introduction" open>
				<summary data-bind:text="content.home.introduction.add-auth.heading"></summary>
				<div class="disclosure-content">
					<p data-bind:html="content.home.introduction.add-auth.firstParagraph"></p>
					<img class="introduction-illustration" src="/asset/illustration/add-auth.svg" alt="" width="349" height="129" loading="lazy">
				</div>
			</details>
			<details name="introduction">
				<summary data-bind:text="content.home.introduction.open-source.heading"></summary>
				<div class="disclosure-content">
					<p data-bind:html="content.home.introduction.open-source.firstParagraph"></p>
					<img class="introduction-illustration" src="/asset/illustration/hosted.svg" alt="" width="349" height="129" loading="lazy">
				</div>
			</details>
			<details name="introduction">
				<summary data-bind:text="content.home.introduction.user-flow.heading"></summary>
				<div class="disclosure-content">
					<p data-bind:html="content.home.introduction.user-flow.firstParagraph"></p>
					<img class="introduction-illustration" src="/asset/illustration/flow.svg" alt="" width="349" height="129" loading="lazy">
				</div>
			</details>
			<details name="introduction">
				<summary data-bind:text="content.home.introduction.dashboard.heading"></summary>
				<div class="disclosure-content">
					<p data-bind:html="content.home.introduction.dashboard.firstParagraph"></p>
					<img class="introduction-illustration" src="/asset/illustration/dashboard.svg" alt="" width="349" height="129" loading="lazy">
				</div>
			</details>
		</div>
	</div>
</section>
