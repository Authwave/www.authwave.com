<section class="features-area" aria-labelledby="features-heading">
	<div class="section-box">
		<header class="section-heading">
			<span class="section-badge">What it does</span>
			<h2 id="features-heading">Features</h2>
		</header>
		<a class="features-action" href="/get-started/"><span class="action-label">Get started</span><span class="action-icon" data-icon="arrow-right" aria-hidden="true"></span></a>
		<div class="features-carousel">
			<div class="feature-frames" tabindex="0" role="region" aria-label="Feature carousel">
				<article class="feature-frame showcase-item" id="feature-one" aria-labelledby="feature-one-heading" data-label="Show simple client libraries">
					<input class="feature-selection" type="radio" name="homepage-feature" id="feature-choice-one" checked aria-labelledby="feature-one-heading">
					<div class="feature-copy showcase-copy">
						<span class="feature-icon" data-icon="book" aria-hidden="true"></span>
						<h3 id="feature-one-heading"><label for="feature-choice-one" data-bind:text="content.home.features.client-libraries.heading"></label></h3>
						<p data-bind:html="content.home.features.client-libraries.firstParagraph"></p>
					</div>
					<div class="feature-picture showcase-media"><img src="/asset/illustration/libraries.png" alt="Placeholder for the first feature image" width="618" height="400" /></div>
				</article>
				<article class="feature-frame showcase-item" id="feature-two" aria-labelledby="feature-two-heading" data-label="Show branding and customisation">
					<input class="feature-selection" type="radio" name="homepage-feature" id="feature-choice-two" aria-labelledby="feature-two-heading">
					<div class="feature-copy showcase-copy">
						<span class="feature-icon" data-icon="brush" aria-hidden="true"></span>
						<h3 id="feature-two-heading"><label for="feature-choice-two" data-bind:text="content.home.features.customisation.heading"></label></h3>
						<p data-bind:html="content.home.features.customisation.firstParagraph"></p>
					</div>
					<div class="feature-picture showcase-media"><img src="/asset/illustration/branding.png" alt="Placeholder for the second feature image" width="618" height="400" /></div>
				</article>
				<article class="feature-frame showcase-item" id="feature-three" aria-labelledby="feature-three-heading" data-label="Show security by default">
					<input class="feature-selection" type="radio" name="homepage-feature" id="feature-choice-three" aria-labelledby="feature-three-heading">
					<div class="feature-copy showcase-copy">
						<span class="feature-icon" data-icon="shield-checkered" aria-hidden="true"></span>
						<h3 id="feature-three-heading"><label for="feature-choice-three" data-bind:text="content.home.features.security.heading"></label></h3>
						<p data-bind:html="content.home.features.security.firstParagraph"></p>
					</div>
					<div class="feature-picture showcase-media"><img src="/asset/illustration/security.png" alt="Placeholder for the third feature image" width="618" height="400" /></div>
				</article>
				<article class="feature-frame showcase-item" id="feature-four" aria-labelledby="feature-four-heading" data-label="Show fully open source">
					<input class="feature-selection" type="radio" name="homepage-feature" id="feature-choice-four" aria-labelledby="feature-four-heading">
					<div class="feature-copy showcase-copy">
						<span class="feature-icon" data-icon="brand-open-source" aria-hidden="true"></span>
						<h3 id="feature-four-heading"><label for="feature-choice-four" data-bind:text="content.home.features.open-source.heading"></label></h3>
						<p data-bind:html="content.home.features.open-source.firstParagraph"></p>
					</div>
					<div class="feature-picture showcase-media"><img src="/asset/illustration/open-source.png" alt="Placeholder for the fourth feature image" width="618" height="400" /></div>
				</article>
			</div>
			<nav class="feature-fallback" aria-label="Choose a feature">
				<a href="#feature-one">1</a>
				<a href="#feature-two">2</a>
				<a href="#feature-three">3</a>
				<a href="#feature-four">4</a>
			</nav>
		</div>
	</div>
</section>
