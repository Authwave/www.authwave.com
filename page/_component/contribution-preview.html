<div class="contribution-preview-editor" data-scroll-reveal data-flux="flux-scroll-progress flux-size">
	<img src="/asset/illustration/code-editor.png" alt="Illustration of an open code editor with colourful lines of code" width="851" height="538" loading="lazy">
</div>
<aside class="glass-notice contribution-notice contribution-notice-merge" aria-label="Contribution ready to merge" data-scroll-reveal data-flux="flux-scroll-progress flux-size">
	<div class="glass-notice-panel">
		<div class="glass-notice-summary">
			<span class="glass-notice-icon" data-icon="git-merge" aria-hidden="true"></span>
			<div class="glass-notice-copy">
				<h3>Ready to merge</h3>
				<p>This change is ready to merge</p>
			</div>
		</div>
	</div>
</aside>
<aside class="glass-notice contribution-notice contribution-notice-checks" aria-label="Contribution checks passed" data-scroll-reveal data-flux="flux-scroll-progress flux-size">
	<div class="glass-notice-panel">
		<div class="glass-notice-summary">
			<span class="glass-notice-icon" data-icon="copy-check" aria-hidden="true"></span>
			<div class="glass-notice-copy">
				<h3>Checks passed</h3>
				<p>All tests passed successfully</p>
			</div>
		</div>
	</div>
</aside>
