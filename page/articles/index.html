<main id="main-content" class="articles-page">
	<section class="page-hero" aria-labelledby="articles-heading">
		<h1 id="articles-heading">Guides, ideas<br />and updates</h1>
		<p class="hero-tagline">Learn how to launch login, signup and identity tools.</p>
		<button class="hero-action" type="button"><span class="action-label">Get started</span><span class="action-icon" data-icon="arrow-right" aria-hidden="true"></span></button>
	</section>
	<section class="articles-area" id="articles-results" aria-label="Articles">
		<div class="section-box">
			<div class="articles-toolbar">
				<nav class="articles-filters" aria-label="Filter articles by category">
					<ul>
						<li data-list="articles-filters"><a data-bind:href="url" data-bind:data-selected="selected" data-bind:aria-label="description" data-bind:text="label">All</a></li>
					</ul>
				</nav>
			</div>
			<p class="articles-status" role="status" data-bind:text="resultSummary"></p>
			<articles-cards data-bind:hidden="?!hasArticles" />
			<p class="articles-empty" data-bind:hidden="?hasArticles">No articles in this category. <a href="/articles/#articles-results">View all articles</a>.</p>
		</div>
		<nav class="articles-pagination" aria-label="Article pages" data-bind:hidden="?!hasPagination">
			<ul>
				<li class="pagination-previous"><a class="page-link articles-previous" aria-label="Previous page"><span data-icon="arrow-right" aria-hidden="true"></span></a></li>
				<li data-list="articles-pages" data-bind:style="position"><a class="page-link" data-bind:href="url" data-bind:aria-current="current" data-bind:aria-label="label" data-bind:text="number">1</a></li>
				<li class="pagination-more" data-bind:hidden="?!hasMorePages" data-bind:style="pagePickerPosition">
					<details class="page-picker">
						<summary class="page-link" data-bind:aria-label="pagePickerLabel">…</summary>
						<ol class="disclosure-content" aria-label="All article pages" tabindex="0">
							<li data-list="articles-all-pages"><a class="page-link" data-bind:href="url" data-bind:aria-current="current" data-bind:aria-label="label" data-bind:text="number">1</a></li>
						</ol>
					</details>
				</li>
				<li class="pagination-next"><a class="page-link articles-next" aria-label="Next page"><span data-icon="arrow-right" aria-hidden="true"></span></a></li>
			</ul>
		</nav>
	</section>
	<contribution-area />
</main>
