	<script>
		// Restore an explicit scheme before CSS paints; System needs no override.
		try {
			const scheme = localStorage.getItem("authwave-color-scheme");
			if(scheme === "light" || scheme === "dark") {
				document.documentElement.dataset.colorScheme = scheme;
			}
		}
		catch {}
	</script>
