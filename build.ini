# TODO: This will not be necessary when flair is released as a stable release. This whole ini should be deleted then.
[style/**/*.scss]
require=node_modules/.bin/sass
execute=./node_modules/.bin/sass ./style/style.scss www/style.css --load-path=node_modules/flair/style --source-map --embed-sources --embed-source-map

[style/**/*.css]
require=vendor/bin/sync
execute=vendor/bin/sync --pattern "**/*.css" style www/style

[asset/**/*]
require=vendor/bin/sync
execute=vendor/bin/sync asset/ www/asset --delete --symlink
