<main id="main-content" class="news-page">
	<section class="page-hero" aria-labelledby="news-heading">
		<h1 id="news-heading">Guides, ideas<br />and updates</h1>
		<p class="hero-tagline">Learn how to launch login, signup and identity tools.</p>
		<button class="hero-action" type="button"><span class="action-label">Get started</span><span class="action-icon" data-icon="arrow-right" aria-hidden="true"></span></button>
	</section>
	<section class="news-area" id="news-results" aria-label="News articles">
		<div class="section-box">
			<div class="news-toolbar">
				<nav class="news-filters" aria-label="Filter articles by category">
					<ul>
						<li data-list="news-filters"><a data-bind:href="url" data-bind:data-selected="selected" data-bind:aria-label="description" data-bind:text="label">All</a></li>
					</ul>
				</nav>
				<a class="news-clear" href="/news/#news-results">Clear all</a>
			</div>
			<p class="news-status" role="status" data-bind:text="resultSummary"></p>
			<div class="news-grid" data-bind:hidden="?!hasArticles">
				<article class="news-card" data-list="news-articles" data-bind:data-category="category">
					<a data-bind:href="url">
						<div class="article-picture" aria-hidden="true"></div>
						<div class="article-meta">
							<span class="article-category" data-bind:text="categoryLabel">Guides</span>
							<time data-bind:datetime="published" data-bind:text="publishedLabel">27 Oct 2026</time>
						</div>
						<h2 class="article-title" data-bind:text="title">Add authentication in minutes</h2>
						<p class="article-summary" data-bind:text="summary">A step-by-step guide to integrating Authwave into your application.</p>
					</a>
				</article>
			</div>
			<p class="news-empty" data-bind:hidden="?hasArticles">No articles match these filters. <a href="/news/#news-results">Clear all filters</a>.</p>
		</div>
		<nav class="news-pagination" aria-label="Article pages" data-bind:hidden="?!hasPagination">
			<ul>
				<li class="pagination-previous"><a class="page-link news-previous" aria-label="Previous page"><span data-icon="arrow-right" aria-hidden="true"></span></a></li>
				<li data-list="news-pages" data-bind:style="position"><a class="page-link" data-bind:href="url" data-bind:aria-current="current" data-bind:aria-label="label" data-bind:text="number">1</a></li>
				<li class="pagination-more" data-bind:hidden="?!hasMorePages" data-bind:style="pagePickerPosition">
					<details class="page-picker">
						<summary class="page-link" data-bind:aria-label="pagePickerLabel">…</summary>
						<ol class="disclosure-content" aria-label="All article pages" tabindex="0">
							<li data-list="news-all-pages"><a class="page-link" data-bind:href="url" data-bind:aria-current="current" data-bind:aria-label="label" data-bind:text="number">1</a></li>
						</ol>
					</details>
				</li>
				<li class="pagination-next"><a class="page-link news-next" aria-label="Next page"><span data-icon="arrow-right" aria-hidden="true"></span></a></li>
			</ul>
		</nav>
	</section>
	<contribution-area />
</main>
